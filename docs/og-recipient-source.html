<!doctype html>
<html><head><meta charset="utf-8"><style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1200px; height:630px; }
  body {
    background:#fff;
    font-family:-apple-system,"Helvetica Neue",Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    display:flex;
  }
  .bar { width:14px; height:630px; background:#2563eb; flex:none; }
  .inner { flex:1; padding:0 84px; display:flex; flex-direction:column; justify-content:center; }
  .eyebrow {
    font-size:20px; font-weight:700; letter-spacing:.20em;
    color:#6b7280; text-transform:uppercase; margin-bottom:34px;
  }
  h1 { font-size:64px; line-height:1.14; font-weight:700; color:#111827; letter-spacing:-.021em; max-width:900px; }
  .rule { margin-top:74px; border-top:1px solid #e5e7eb; padding-top:22px; }
  .host { font-size:21px; color:#9ca3af; }
</style></head>
<body>
  <div class="bar"></div>
  <div class="inner">
    <div class="eyebrow">FlowGuide</div>
    <!-- Neutral by construction. No marketing line, no packet content, no
         client name — this one image is served for EVERY recipient link. -->
    <h1>A FlowGuide has been shared with you.</h1>
    <div class="rule"><div class="host">flowguide-ruddy.vercel.app</div></div>
  </div>
</body></html>
