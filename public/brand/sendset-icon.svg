<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="Sendset">
  <defs>
    <clipPath id="screen">
      <rect x="210" y="150" width="604" height="724" rx="96"/>
    </clipPath>
  </defs>

  <!-- phone -->
  <rect x="138" y="76" width="748" height="872" rx="170"
        fill="none" stroke="#0F2D4A" stroke-width="72"/>
  <rect x="406" y="120" width="212" height="48" rx="24" fill="#0F2D4A"/>

  <!-- content cards -->
  <g clip-path="url(#screen)">
    <rect x="230" y="240" width="585" height="152" rx="52"
          fill="#5B9DEF" transform="rotate(-5 522 316)"/>
    <rect x="220" y="392" width="602" height="162" rx="54"
          fill="#3F7FC3" transform="rotate(-5 521 473)"/>
    <rect x="222" y="554" width="600" height="160" rx="54"
          fill="#6CC48A" transform="rotate(-5 522 634)"/>
    <rect x="228" y="710" width="594" height="178" rx="58"
          fill="#FF684A" transform="rotate(-5 525 799)"/>

    <!-- restrained "information" cue -->
    <rect x="294" y="430" width="174" height="28" rx="14" fill="#FFFFFF" opacity="0.94"
          transform="rotate(-5 381 444)"/>
    <rect x="294" y="472" width="128" height="28" rx="14" fill="#FFFFFF" opacity="0.72"
          transform="rotate(-5 358 486)"/>

    <!-- send cue -->
    <path d="M555.0,760.0 L720.6,724.0 L659.4,889.6 L630.6,823.0 L587.4,806.8 Z" fill="#FFFFFF"
          transform="rotate(-7 645 814)"/>
